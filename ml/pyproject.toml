[project]
name = "cufflink-ml"
version = "0.1.0"
description = "Train and export small text classifiers for the cufflink-model crate"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.5.4", "scikit-learn>=1.5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cufflink_ml"]
