[package]
name = "cufflink-fn"
version = "0.34.0"
edition = "2021"
description = "Write custom Cufflink handlers in Rust — compiles to WASM"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["crud", "microservice", "wasm", "handler", "functions"]
categories = ["wasm", "web-programming"]
readme = "../README.md"

[features]
stripe = ["dep:hmac", "dep:sha2", "dep:hex", "dep:chrono"]
db-v2 = ["dep:chrono"]
cache = []
service-call = []
response-v2 = []
delivery-control = ["response-v2"]
nats-publish-v2 = []
http-v2 = []
storage-v2 = []
util-v2 = []
ext-call = []
test-host = [
    "dep:postgres",
    "dep:postgresql_embedded",
    "dep:cufflink-pgcodec",
    "dep:cufflink-migrate",
    "dep:libc",
]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
cufflink-types = { workspace = true }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
hex = { version = "0.4.3", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std"], optional = true }
serde_urlencoded = "0.7.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.28.0", features = ["v4"] }
postgres = { version = "0.19.14", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
postgresql_embedded = { version = "0.21.0", default-features = false, features = ["theseus", "blocking", "rustls"], optional = true }
cufflink-pgcodec = { workspace = true, optional = true }
cufflink-migrate = { workspace = true, optional = true }
libc = { version = "0.2.191", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "rt-multi-thread"] }
