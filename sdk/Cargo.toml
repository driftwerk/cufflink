[package]
name = "cufflink"
version = "0.17.0"
edition = "2021"
description = "Define CRUD microservices in Rust — deploy with a single command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["crud", "microservice", "rest-api", "postgres", "deploy"]
categories = ["web-programming", "database"]
readme = "../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["serde", "std"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
cufflink-types = { workspace = true }
cufflink-sdk-macros = { workspace = true }
schemars = { version = "1", default-features = false, features = ["derive", "std", "uuid1", "chrono04"], optional = true }

[features]
typed-routes = ["dep:schemars"]

[dev-dependencies]
trybuild = { workspace = true }
