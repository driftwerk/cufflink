[package]
name = "cufflink-types"
version = "0.18.0"
edition = "2021"
description = "Shared type definitions for the Cufflink CRUD microservice platform"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["crud", "microservice", "schema", "types"]
categories = ["web-programming", "database"]
readme = "../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
uuid = { version = "1", default-features = false, features = ["serde", "std"], optional = true }
wasmparser = { version = "0.236", default-features = false, features = ["std"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
chrono-tz = { version = "0.10", default-features = false, features = ["std"], optional = true }
croner = { version = "4.0.1", optional = true }

[features]
wasm-inspect = ["dep:wasmparser"]
schedule-eval = ["dep:chrono", "dep:chrono-tz", "dep:croner"]
protocol = ["dep:uuid"]

[dev-dependencies]
wat = "1"
