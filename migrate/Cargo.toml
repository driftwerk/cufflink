[package]
name = "cufflink-migrate"
version = "0.18.0"
edition = "2021"
description = "SQL migration planning for Cufflink services: checksums, history and locks compatible with refinery"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["migrations", "sql", "refinery", "postgres"]
categories = ["database"]
readme = "../README.md"

[dependencies]
cufflink-types = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
siphasher = "1.0.4"
thiserror = "2.0.21"

[dev-dependencies]
refinery-core = "0.10.1"
tempfile = "3.27.0"
