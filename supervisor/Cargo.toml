[package]
name = "cufflink-supervisor"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/driftwerk/cufflink"
description = "Child-process supervision shared by the Cufflink runners"
publish = false

[dependencies]
axum = { workspace = true }
cufflink-settings = { workspace = true }
cufflink-shutdown = { workspace = true }
cufflink-telemetry = { workspace = true }
cufflink-types = { workspace = true, features = ["protocol"] }
eyre = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = "2.6.1"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
futures-util = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
