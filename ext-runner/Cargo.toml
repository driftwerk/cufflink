[package]
name = "cufflink-ext-runner"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/driftwerk/cufflink"
description = "Cufflink extension runner — supervises native services and relays their calls"
publish = false

[[bin]]
name = "cufflink-ext-runner"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
cufflink-nats = { workspace = true }
cufflink-native = { workspace = true }
cufflink-settings = { workspace = true }
cufflink-shutdown = { workspace = true }
cufflink-supervisor = { workspace = true }
cufflink-telemetry = { workspace = true }
cufflink-types = { workspace = true, features = ["protocol"] }
eyre = { workspace = true }
futures-util = { workspace = true }
getrandom = "0.4.3"
hex = { workspace = true }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = { workspace = true }
metrics = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
cufflink-test-guests = { workspace = true }
cufflink-testkit = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
