[package]
name = "cufflink-cli"
version = "0.25.0"
edition = "2021"
description = "CLI for the Cufflink CRUD microservice platform — deploy, init, and manage services"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["crud", "microservice", "cli", "deploy"]
categories = ["command-line-utilities", "web-programming"]
readme = "../README.md"
exclude = ["tests/"]

[[bin]]
name = "cufflink"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
uuid = { workspace = true }
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
hex = "0.4.3"
eyre = "0.6.14"
toml = "0.9.12"
base64 = "0.23.1"
flate2 = "1.1.10"
urlencoding = "2.1.3"
securestore = "0.100.3"
tempfile = "3.27.0"
cufflink-types = { workspace = true, features = ["wasm-inspect"] }
cufflink-migrate = { workspace = true }
comfy-table = "7.2.2"
shellexpand = "3.1.2"
chrono.workspace = true
serde_yaml = "0.9.34"
glob-match = "0.2.1"
notify = "8.2.0"

[dev-dependencies]
cufflink-testkit = { workspace = true }
wat = { workspace = true }
