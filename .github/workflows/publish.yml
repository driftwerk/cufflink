name: Publish Crates

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  verify:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Find the passing CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ci-passed.sh "$GITHUB_SHA"

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: verify
    env:
      CRATES: cufflink-types cufflink-migrate cufflink-pgcodec cufflink-fn cufflink-sdk-macros cufflink cufflink-cli cufflink-nats cufflink-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - name: Check the tag matches the workspace
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "cufflink-fn") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match cufflink-fn $version"
            exit 1
          fi

      - name: Check no crate's version is taken
        run: |
          for crate in $CRATES; do
            .github/scripts/publish-crate.sh --check "$crate"
          done

      - name: Publish the crates in dependency order
        run: |
          for crate in $CRATES; do
            .github/scripts/publish-crate.sh "$crate"
          done

  release:
    name: Build CLI & Create Release
    runs-on: ubuntu-latest
    needs: [verify, publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build CLI release binary
        env:
          CUFFLINK_VERSION: sha-${{ github.sha }}
        run: cargo build --release -p cufflink-cli

      - name: Prepare binary
        run: |
          cp target/release/cufflink cufflink-linux-x86_64
          chmod +x cufflink-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: cufflink-linux-x86_64
          generate_release_notes: true
