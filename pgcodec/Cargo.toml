[package]
name = "cufflink-pgcodec"
version = "0.18.0"
edition = "2021"
description = "How Cufflink renders Postgres rows as JSON and binds JSON parameters to Postgres types"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["postgres", "json", "codec"]
categories = ["database", "encoding"]
readme = "../README.md"

[dependencies]
cufflink-types = { workspace = true }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.23.1"
bytes = "1.12.1"
