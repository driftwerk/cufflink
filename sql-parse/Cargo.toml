[package]
name = "cufflink-sql-parse"
version = "0.1.1"
edition = "2021"
description = "PostgreSQL's own parser for Cufflink: the bounds before a parse, the parser process's wire and, with `parser`, the parse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/driftwerk/cufflink"
keywords = ["postgres", "sql", "parser", "wasm"]
categories = ["database", "parser-implementations"]
readme = "../README.md"

[features]
parser = ["dep:pg_query", "dep:sha2", "dep:hex"]

[dependencies]
cufflink-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pg_query = { version = "=6.2.1", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
