receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  groupbyattrs/cufflink-scope:
    keys: [cufflink.tenant, cufflink.service, cufflink.version]

  transform/cufflink-scope:
    error_mode: propagate
    log_statements: &scope
      - context: resource
        statements:
          - set(attributes["service.namespace"], attributes["cufflink.tenant"]) where attributes["cufflink.service"] != nil
          - set(attributes["service.version"], attributes["cufflink.version"]) where attributes["cufflink.service"] != nil and attributes["cufflink.version"] != nil
          - set(attributes["service.name"], attributes["cufflink.service"]) where attributes["cufflink.service"] != nil
          - delete_matching_keys(attributes, "^cufflink\\.(tenant|service|version)$") where attributes["service.namespace"] != nil
    trace_statements: *scope

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, groupbyattrs/cufflink-scope, transform/cufflink-scope, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, groupbyattrs/cufflink-scope, transform/cufflink-scope, batch]
      exporters: [otlphttp/loki]
